# Conex\u00e3o principal com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/guidaz_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=computacao
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configura\u00e7\u00f5es Cr\u00edticas do Hibernate para criar as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar seguran\u00e7a padr\u00e3o do Spring Boot para testar as rotas livres
spring.security.user.name=admin
spring.security.user.password=admin