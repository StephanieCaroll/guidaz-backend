# Conexão principal com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/guidaz_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações Críticas do Hibernate para criar as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar segurança padrão do Spring Boot para testar as rotas livres
spring.security.user.name=admin
spring.security.user.password=admin